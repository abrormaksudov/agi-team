version: 2

models:
  - name: datamart__deposits_daily
    description: >
      Term deposits of individuals at the end of each operating day: one row per deposit contract that was open on the
      day (started on or before it and not closed before its end). Contract data from ods__iabs__deposit_contract; the
      balance is the closing balance of the deposit's account from ods__iabs__account_balance on the day or the latest
      day before it. Amounts in minor units of the deposit currency (tiyin for UZS, cents for USD) except balance_uzs,
      which is in tiyin. Accrued interest is simple interest from the start date to the report day on 365 days. Loaded
      per operating day with delete+insert on report_date; replaying a day replaces it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: datamart__deposits_daily__unique_report_date_deposit_id
          arguments:
            combination_of_columns: [ "report_date", "deposit_id" ]
      - dbt_utils.expression_is_true:
          name: datamart__deposits_daily__balance_not_negative
          arguments:
            expression: "balance >= 0"
    columns:
      - name: report_date
        description: Operating day (end of day)
        data_tests:
          - not_null:
              name: datamart__deposits_daily__not_null_report_date
      - name: deposit_id
        description: Internal identifier of the deposit contract in iABS
        data_tests:
          - not_null:
              name: datamart__deposits_daily__not_null_deposit_id
      - name: contract_number
        description: Contract number as printed on the contract, TD- followed by the deposit_id
      - name: customer_code
        description: Depositor's 8-digit iABS customer code
      - name: deposit_type
        description: Term of the deposit, term_6m, term_12m or term_18m months
        data_tests:
          - accepted_values:
              name: datamart__deposits_daily__accepted_values_deposit_type
              arguments:
                values: [ "term_6m", "term_12m", "term_18m" ]
      - name: currency_code
        description: Currency of the deposit, UZS or USD
        data_tests:
          - accepted_values:
              name: datamart__deposits_daily__accepted_values_currency_code
              arguments:
                values: [ "UZS", "USD" ]
      - name: contract_amount
        description: Principal of the deposit as opened, in minor units of the deposit currency
      - name: interest_rate
        description: Annual interest rate in percent; 22.5 means 22.5 percent a year
      - name: start_date
        description: Date the deposit was opened
      - name: planned_end_date
        description: Date the deposit term ends according to the contract
      - name: days_to_maturity
        description: Calendar days from the report day to the planned end date; negative when the planned end has passed and the deposit is still open
      - name: balance
        description: Closing balance of the deposit's account on the report day, or on the latest earlier day it moved; 0 when the account has no balance row yet. In minor units of the deposit currency
      - name: balance_uzs
        description: Closing balance of the deposit's account in UZS tiyin, converted at the CBU rate of the day the account last moved (iABS closing_balance_eqv), so a foreign-currency deposit is not revalued on quiet days; 0 when there is no balance row
      - name: accrued_interest
        description: Interest accrued from the start date to the report day, simple interest on 365 days, in minor units of the deposit currency
      - name: dwh_job_id
        description: Identifier of the load job (Airflow run) that wrote the row
      - name: dwh_created_at
        description: Time the row was written to the DWH
