version: 2

models:
  - name: ods__iabs__account_balance
    description: >
      Daily balance and turnover of iABS accounts, one row per account and operating day, only on days the
      account moved; the balance on a quiet day is the latest row before it. Amounts in tiyin (1/100 UZS) or
      minor units of the account currency. The balance follows the account's side: credits increase passive
      (liability) accounts such as customer card and deposit accounts, debits increase active ones. Loaded per
      operating day; replaying a day replaces it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: ods__iabs__account_balance__unique_account_id_oper_day
          arguments:
            combination_of_columns: [ "account_id", "oper_day" ]
    columns:
      - name: account_id
        description: Account identifier (ods__iabs__account.account_id)
        data_tests:
          - not_null:
              name: ods__iabs__account_balance__not_null_account_id
      - name: oper_day
        description: Operating day of the movement
        data_tests:
          - not_null:
              name: ods__iabs__account_balance__not_null_oper_day
      - name: opening_balance
        description: Balance at the start of the operating day, in minor units of the account currency
      - name: debit_turnover
        description: Sum of debit postings during the day
      - name: credit_turnover
        description: Sum of credit postings during the day
      - name: closing_balance
        description: Balance at the end of the operating day, in minor units of the account currency
      - name: closing_balance_eqv
        description: Closing balance in tiyin, converted at the CBU rate of the day
      - name: dwh_job_id
        description: Identifier of the load job (Airflow run) that wrote the row
      - name: dwh_created_at
        description: Time the row was written to the DWH
