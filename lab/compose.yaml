name: agi-lab

x-source-db: &source-db
  image: postgres:17.11-bookworm
  restart: unless-stopped
  command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: lab/airflow/Dockerfile
  image: agi-lab/airflow:3.3.2
  restart: unless-stopped
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Tashkent
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: agi-lab-jwt-secret
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW_CONN_GREENPLUM: postgresql://gpadmin:gpadmin@greenplum:5432/dwh
    AIRFLOW_CONN_IABS: postgresql://loader:loader@iabs:5432/iabs
    AIRFLOW_CONN_MOBILE: postgresql://loader:loader@mobile:5432/mobile
    AIRFLOW_CONN_TRANZAXIS: postgresql://loader:loader@tranzaxis:5432/tranzaxis
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./dbt:/opt/dbt:ro
    - ./data:/opt/lab/data:ro
    - airflow-logs:/opt/airflow/logs
    - dbt-state:/opt/airflow/dbt-state
  depends_on: &airflow-common-depends-on
    airflow-init:
      condition: service_completed_successfully

services:
  iabs:
    <<: *source-db
    environment:
      POSTGRES_DB: iabs
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./sources/init:/docker-entrypoint-initdb.d:ro
      - iabs-data:/var/lib/postgresql/data

  mobile:
    <<: *source-db
    environment:
      POSTGRES_DB: mobile
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ./sources/init:/docker-entrypoint-initdb.d:ro
      - mobile-data:/var/lib/postgresql/data

  tranzaxis:
    <<: *source-db
    environment:
      POSTGRES_DB: tranzaxis
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - ./sources/init:/docker-entrypoint-initdb.d:ro
      - tranzaxis-data:/var/lib/postgresql/data

  greenplum:
    build: ./greenplum
    image: agi-lab/greenplum:6.29.11
    restart: unless-stopped
    hostname: greenplum
    environment:
      GREENPLUM_DEPLOYMENT: singlenode
      GREENPLUM_DATABASE_NAME: dwh
      GREENPLUM_PASSWORD: gpadmin
      GREENPLUM_PXF_ENABLE: "true"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - greenplum-data:/data
    shm_size: 256m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.lab-ready && /usr/local/greenplum-db/bin/pg_isready -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s

  liquibase:
    build: ./liquibase
    image: agi-lab/liquibase:5.0.4
    working_dir: /liquibase/changelog
    entrypoint: ["sh", "deploy.sh"]
    volumes:
      - ./liquibase:/liquibase/changelog:ro
    depends_on:
      greenplum:
        condition: service_healthy

  airflow-db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - DBT_WRITE_JSON=True dbt deps && DBT_WRITE_JSON=True dbt parse && /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    depends_on:
      airflow-db:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  airflow-db-data:
  airflow-logs:
  dbt-state:
  iabs-data:
  mobile-data:
  tranzaxis-data:
  greenplum-data:
